name: Publish Unipus Usage Supplement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unipus-supplement.yml
      - docs/unipus/**
      - packaging/test_unipus_helper.ps1
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-unipus-supplement
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
      - name: Verify helper and publish supplement to v0.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/test_unipus_helper.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Helper verification failed' }
          New-Item -ItemType Directory -Path dist/stage/UnipusAI-v3.6-windows-x86-64 -Force | Out-Null
          Copy-Item docs/unipus/* dist/stage/UnipusAI-v3.6-windows-x86-64/
          Copy-Item docs/unipus/* dist/
          Compress-Archive -Path dist/stage/* -DestinationPath dist/UnipusAI-v3.6-usage-and-import.zip
          $assets = @('UnipusAI-v3.6-usage-and-import.zip', 'Import-Missing-Units.cmd', 'U校园使用说明.md')
          $lines = foreach ($name in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content dist/SHA256SUMS-unipus.txt -Encoding utf8
          gh release upload v0.1.1 dist/UnipusAI-v3.6-usage-and-import.zip dist/Import-Missing-Units.cmd dist/U校园使用说明.md dist/SHA256SUMS-unipus.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Supplement upload failed' }
          $json = gh release view v0.1.1 --repo $env:GITHUB_REPOSITORY --json body
          if ($LASTEXITCODE -ne 0) { throw 'Release read failed' }
          $body = ($json | ConvertFrom-Json).body
          if ($body -notmatch '<!-- unipus-supplement -->') {
            $body += "`n`n<!-- unipus-supplement -->`n## U 校园使用说明与一键补抓补充包`n下载 UnipusAI-v3.6-usage-and-import.zip，解压到完整整合包根目录并合并文件夹。也可单独下载 U校园使用说明.md 和 Import-Missing-Units.cmd。`n补抓脚本读取已保存配置，执行 dump-text 增量导入；不会强制清库或执行答题与课程提交。遇到权限或限流错误仍需按说明排查。`n原 full ZIP 保留不变，此补充包不含账号、配置、数据库或新二进制。校验值见 SHA256SUMS-unipus.txt。`n"
            $notes = Join-Path $env:RUNNER_TEMP 'unipus-release-notes.md'
            $body | Set-Content -LiteralPath $notes -Encoding utf8
            gh release edit v0.1.1 --repo $env:GITHUB_REPOSITORY --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          }
